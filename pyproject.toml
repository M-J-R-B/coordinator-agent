[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "precheck-agent"
version = "0.1.0"
requires-python = ">=3.10"
# 2.x renamed FastMCP/ClientSession; this code uses the 1.x API.
dependencies = ["mcp>=1.27,<2", "claude-agent-sdk>=0.2.182", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest"]
# Read-only UI. Streamlit needs Python 3.11+; the agent itself stays 3.10+,
# so on 3.10 this extra installs nothing and the UI tests skip.
ui = ["streamlit>=1.67; python_version >= '3.11'"]

[tool.setuptools]
# Flat layout with several top-level folders: list the packages explicitly.
packages = ["mock_site", "mcp_server", "agent", "ui", "site_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

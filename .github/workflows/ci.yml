name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The test job only reads code. The Claude PR review gets its own workflow
# with its own (write) permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Live model tests skip themselves: PRECHECK_LIVE is never set here.
      - name: Test
        run: python -m pytest -v

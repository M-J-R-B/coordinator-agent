name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push to the PR cancels the review of the previous commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are work in progress: don't spend subscription usage on them.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Separate from ci.yml so the test job stays read-only.
    permissions:
      contents: read        # read the code
      pull-requests: write  # post review comments
      id-token: write       # the action's GitHub App sign-in
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Claude subscription token (claude setup-token), not an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the pre/post-check agent. Read CLAUDE.md
            first: its Rules and Working style sections are the review checklist.
            Use `gh pr diff` and `gh pr view` to see the change, and read the
            surrounding code where you need context. Review only what this PR
            changes.

            Check every change against these project rules:
            1. Status is only online, offline or unknown. A tool timeout or error
               must become unknown, never online.
            2. A device already offline in the pre-check is pre-existing, not a
               post-check failure.
            3. Release is allowed only with no new offline and no unknown devices,
               and it is enforced in code (the PreToolUse release hook), never
               only in a prompt.
            4. Tool errors are structured and keep "device offline" separate from
               "tool failed".
            5. The baseline is saved to and reloaded from disk, never taken from
               conversation history.
            6. Every check ends with a report that validates against the JSON
               schema in schemas/.
            Also check the working style: small functions, no new dependencies
            without asking, tests for new or changed behaviour, and correctness
            bugs in general.

            How to report:
            - For each real problem, post an inline comment on the exact line with
              mcp__github_inline_comment__create_inline_comment. Say which rule or
              bug it is, why it matters, and a concrete fix.
            - Then post ONE summary comment with `gh pr comment`: a short verdict,
              the issues found (most severe first), or "No issues found" if there
              are none.
            - Do not comment on style nits, and do not praise. Do not edit files.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
